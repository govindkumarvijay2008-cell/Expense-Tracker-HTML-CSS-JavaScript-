<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Expense Tracker</title><link rel="stylesheet" href="style.css"></head>
<body><main class="app"><p class="tag">PERSONAL FINANCE</p><h1>Expense Tracker</h1><section class="total"><span>Total spent</span><strong id="total">₹0.00</strong></section><form id="form"><label>Description<input id="description" maxlength="60" required placeholder="e.g. Bus fare"></label><label>Amount (₹)<input id="amount" type="number" min="0.01" step="0.01" required placeholder="0.00"></label><button>Add expense</button></form><h2>Expenses</h2><ul id="expenses"></ul><p id="empty">No expenses added yet.</p><button id="clear" class="clear">Clear all</button></main><p class="credit">Created by Govind Kumar Vijay</p><script src="script.js"></script></body></html>
